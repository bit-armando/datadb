extraMetadata:
  main: out/main/main.js

# `asar: false` NO es un descuido: `utilityProcess.fork` —el proceso que hospeda los drivers— no
# puede ejecutar un script que vive DENTRO de un .asar. Medido: con asar activo el worker moría con
# código 1 sin escribir una sola línea (el bundle empaquetado arrancaba la ventana pero no conectaba
# a ninguna base). Sin asar, el árbol de archivos es normal y el worker arranca. El coste es no tener
# un único blob de código; el tamaño es el mismo (asar no comprime).
asar: false
npmRebuild: false

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
  # Sin certificado de Apple: firma ad-hoc. La app arranca, pero macOS la marca como no notarizada
  # (ver README-instalacion.md: clic derecho ▸ Abrir, o `xattr -dr com.apple.quarantine`).
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  title: DataDB
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

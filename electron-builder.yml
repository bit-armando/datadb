# Empaquetado de DataDB (macOS, arm64) — fase 28 / R29.
#
# Qué produce: `release/DataDB-<versión>-arm64.dmg`, una app AUTOCONTENIDA (Electron + out/ + las
# dependencias de producción). No es una firma notarizada: el proyecto es personal y compartido con
# amigos, así que se firma ad-hoc (`identity: null`) y se instala sin Gatekeeper con el README.
#
# Decisiones que importan:
#  - `appId: mx.datadb.app` es el MISMO bundle id que ya usa la app en desarrollo: el directorio de
#    datos (`~/Library/Application Support/mx.datadb.app`) y el ítem de Keychain de `safeStorage`
#    («DataDB Safe Storage») quedan compartidos entre `npm start` y el .dmg. Cambiarlo ahora haría
#    que las conexiones guardadas y las contraseñas cifradas no se encontraran.
#  - `asar: true`: el código va empaquetado; `out/**` entra tal cual y `extraMetadata.main` apunta a
#    `out/main/main.js`, que es el mismo entry que usa `electron .`.
#  - Se EXCLUYEN del paquete los artefactos de desarrollo (`design/`, `.planning/`, `scripts/`,
#    `src/`) — el .dmg no es el repo.
#  - `npmRebuild: false`: los drivers (pg, mysql2, mssql) son JS puro; no hay módulos nativos que
#    recompilar y así el empaquetado no depende de tener el toolchain de Xcode completo.
appId: mx.datadb.app
productName: DataDB
copyright: Copyright © 2026 DataDB

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json
  # Solo lo que el proceso principal USA en tiempo de ejecución. El renderer ya viene empaquetado
  # por Vite dentro de `out/renderer`, así que React, CodeMirror, lucide y compañía no necesitan
  # estar aquí (antes pesaban la mitad del .asar). Esta lista la genera
  # `node scripts/deps-runtime.mjs` leyendo los `require()` reales de `out/main` y cerrando las
  # dependencias transitivas: NO se edita a mano.
